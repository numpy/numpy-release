[tool.cibuildwheel]
# Note: the below skip command doesn't do much currently, the platforms to
# build wheels for in CI are controlled in `.github/workflows/wheels.yml`.
# universal2 wheels are not supported (see gh-21233), use `delocate-fuse` if you need them
skip = ["*_i686", "*_ppc64le", "*_s390x", "*_universal2"]

# pin the tools cibuildwheel itself uses (pip, build, delocate, delvewheel). This is
# the default, but state it explicitly - everything else here is pinned deliberately.
dependency-versions = "pinned"

# we install all build dependencies ourselves in the cibw_before_build step
build-frontend = { name = "build", args = ["--no-isolation"] }
before-build = "bash {project}/tools/wheels/cibw_before_build.sh {project} {package}"
before-test = "bash {project}/tools/wheels/cibw_before_test.sh {project}"
test-command = "bash {project}/tools/wheels/cibw_test_command.sh {project}"
enable = ["cpython-prerelease"]

# The build will use openblas64 everywhere, except on arm64 macOS >=14.0 (uses Accelerate)
[tool.cibuildwheel.config-settings]
setup-args = ["-Duse-ilp64=true", "-Dallow-noblas=false"]
build-dir = "build"

[tool.cibuildwheel.ios]
before-build = []
xbuild-tools = ["ninja"]

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
musllinux-x86_64-image = "musllinux_1_2"
musllinux-aarch64-image = "musllinux_1_2"

[tool.cibuildwheel.linux.environment]
# RUNNER_OS is a GitHub Actions specific env var; define it here so it's
# defined when running cibuildwheel locally
RUNNER_OS="Linux"

[tool.cibuildwheel.windows]
config-settings = {setup-args = ["--vsenv", "-Dallow-noblas=false"], build-dir="build"}
repair-wheel-command = "bash -el ./tools/wheels/repair_windows.sh {wheel} {dest_dir}"

[[tool.cibuildwheel.overrides]]
select = ["*-android_*", "*-*linux_*"]
environment.PKG_CONFIG_PATH = "$(pwd)/.openblas"

[[tool.cibuildwheel.overrides]]
select = ["*-win32"]
config-settings = {setup-args = ["--vsenv", "-Dallow-noblas=true"], build-dir="build"}
repair-wheel-command = ""

[[tool.cibuildwheel.overrides]]
select = ["*-android*", "*-ios*"]
before-test = ""
test-groups = ["test-core"]

[[tool.cibuildwheel.overrides]]
select = ["*-android*", "*-ios*", "*-pyodide*"]
# Mobile and WASM platforms can't run the cibw_test_command shell script, so they must
# run Python directly.
test-command = """
    python -m pytest --pyargs numpy \
        -m 'not slow' \
        -W ignore::PendingDeprecationWarning \
        -p no:cacheprovider
"""

[tool.cibuildwheel.pyodide]
# Pyodide ensures that the wheels are already repaired by auditwheel-emscripten
repair-wheel-command = ""

[tool.cibuildwheel.pyodide.config-settings]
build-dir = "build"
setup-args = ["--cross-file={package}/tools/ci/emscripten/emscripten.meson.cross", "-Dblas=none", "-Dlapack=none"]
